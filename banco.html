<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestionale Bancone - Grasso</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background: #1a1209; color: #f5e6c8; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }
        .app-container { max-width: 1400px; width: 100%; display: grid; grid-template-columns: 1fr 380px; gap: 20px; }
        
        .left-panel { background: #2a1e13; border-radius: 20px; padding: 20px; border: 1px solid #d4a84b33; }
        .header-banco { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .header-banco h1 { font-size: 1.6rem; color: #d4a84b; font-weight: 800; }
        .header-banco h1 i { margin-right: 10px; }
        .header-banco .printer-status { color: #a08b6d; font-size: 0.8rem; }
        .header-banco .printer-status i { color: #4ade80; }
        
        .search-bar { position: relative; margin-bottom: 15px; display: flex; gap: 10px; }
        .search-bar input { flex: 1; padding: 14px 20px 14px 50px; border-radius: 12px; border: 2px solid #d4a84b44; background: #1a1209; color: #f5e6c8; font-size: 1rem; }
        .search-bar input:focus { border-color: #d4a84b; outline: none; box-shadow: 0 0 20px #d4a84b33; }
        .search-bar .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #d4a84b; font-size: 1.2rem; }
        .search-bar .clear-search { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #a08b6d; cursor: pointer; display: none; }
        .search-bar .clear-search.show { display: block; }
        
        .mic-btn { background: #3d2b1a; border: 2px solid #d4a84b44; border-radius: 12px; padding: 12px 18px; color: #d4a84b; font-size: 1.2rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        .mic-btn:hover { border-color: #d4a84b; background: #d4a84b22; }
        .mic-btn.listening { background: #dc2626; border-color: #dc2626; color: white; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 #dc262644; } 50% { box-shadow: 0 0 30px 10px #dc262622; } }
        .mic-btn .mic-text { font-size: 0.7rem; font-weight: 600; }
        
        .voice-status { font-size: 0.8rem; color: #a08b6d; margin-bottom: 10px; min-height: 1.5rem; padding: 5px 10px; background: #1a1209; border-radius: 8px; }
        .voice-status.active { color: #4ade80; border-left: 3px solid #4ade80; }
        .voice-status.error { color: #f87171; border-left: 3px solid #f87171; }
        .voice-status.success { color: #fbbf24; border-left: 3px solid #fbbf24; }
        
        .categorie-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; scrollbar-width: none; }
        .categorie-scroll::-webkit-scrollbar { display: none; }
        .cat-btn { background: #3d2b1a; border: 2px solid transparent; color: #a08b6d; padding: 10px 20px; border-radius: 30px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; cursor: pointer; transition: 0.3s; }
        .cat-btn.active { background: #d4a84b; color: #1a1209; border-color: #f0d78c; box-shadow: 0 0 20px #d4a84b55; }
        .cat-btn:hover { border-color: #d4a84b; }
        
        .prodotti-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; max-height: 45vh; overflow-y: auto; padding-right: 5px; }
        .prodotti-grid::-webkit-scrollbar { width: 6px; }
        .prodotti-grid::-webkit-scrollbar-thumb { background: #d4a84b; border-radius: 10px; }
        .prod-item { background: #3d2b1a; border-radius: 16px; padding: 12px 8px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .prod-item:hover { border-color: #d4a84b; transform: translateY(-3px); }
        .prod-item:active { transform: scale(0.95); }
        .prod-item .prod-img { width: 70px; height: 70px; border-radius: 12px; object-fit: cover; background: #1a1209; border: 1px solid #d4a84b44; }
        .prod-item .price { color: #d4a84b; font-weight: 800; font-size: 1.1rem; }
        .prod-item .name { font-weight: 600; font-size: 0.85rem; line-height: 1.2; min-height: 2.4rem; }
        .prod-item.disabled { opacity: 0.4; filter: grayscale(1); pointer-events: none; }
        .prod-item .badge-esaurito { background: #dc2626; color: white; font-size: 0.6rem; padding: 2px 8px; border-radius: 20px; font-weight: 700; }
        
        .right-panel { background: #2a1e13; border-radius: 20px; padding: 20px; border: 1px solid #d4a84b33; display: flex; flex-direction: column; height: fit-content; max-height: 95vh; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #d4a84b33; padding-bottom: 15px; }
        .cart-header h2 { color: #d4a84b; font-size: 1.2rem; }
        .cart-header .totale { background: #d4a84b; color: #1a1209; padding: 5px 15px; border-radius: 30px; font-weight: 800; }
        
        .cart-items { flex: 1; overflow-y: auto; max-height: 180px; margin-bottom: 10px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #ffffff11; font-size: 0.9rem; }
        .cart-item .item-info { display: flex; align-items: center; gap: 8px; flex: 1; }
        .cart-item .item-info .remove-item { background: none; border: none; color: #f87171; cursor: pointer; font-size: 0.8rem; padding: 2px 6px; border-radius: 4px; transition: 0.2s; }
        .cart-item .item-info .remove-item:hover { background: #f8717122; }
        .cart-item .qty-control { display: flex; align-items: center; gap: 8px; }
        .cart-item .qty-btn { background: #3d2b1a; border: none; color: #d4a84b; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-weight: 700; font-size: 0.9rem; }
        .cart-item .qty-btn:hover { background: #d4a84b; color: #1a1209; }
        
        .dati-cliente { background: #1a1209; border-radius: 16px; padding: 12px; margin: 8px 0; }
        .dati-cliente input, .dati-cliente textarea { width: 100%; background: transparent; border: 1px solid #d4a84b44; border-radius: 10px; padding: 10px 12px; color: #f5e6c8; margin-bottom: 8px; font-size: 0.85rem; }
        .dati-cliente input:focus, .dati-cliente textarea:focus { border-color: #d4a84b; outline: none; }
        .dati-cliente .row { display: flex; gap: 8px; }
        .dati-cliente .row * { flex: 1; }
        .dati-cliente .row-data { display: flex; gap: 8px; }
        .dati-cliente .row-data input[type="date"] { flex: 2; }
        .dati-cliente .row-data input[type="time"] { flex: 1; }
        
        .mittente-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .mittente-row label { color: #a08b6d; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
        .mittente-row select { flex: 1; background: transparent; border: 1px solid #d4a84b44; border-radius: 10px; padding: 10px 12px; color: #f5e6c8; font-size: 0.85rem; }
        .mittente-row select:focus { border-color: #d4a84b; outline: none; }
        .mittente-row select option { background: #2a1e13; color: #f5e6c8; }
        
        .actions { display: flex; gap: 8px; margin-top: 8px; }
        .btn-primary-banco { background: #d4a84b; color: #1a1209; border: none; padding: 14px; border-radius: 16px; font-weight: 800; font-size: 1rem; width: 100%; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary-banco:hover { background: #f0d78c; transform: scale(1.02); }
        .btn-primary-banco:active { transform: scale(0.95); }
        .btn-secondary-banco { background: #3d2b1a; color: #f5e6c8; border: 1px solid #d4a84b44; padding: 14px; border-radius: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-secondary-banco:hover { background: #4a3728; }
        .status-msg { text-align: center; margin-top: 8px; font-size: 0.75rem; color: #a08b6d; min-height: 1.2rem; }
        
        .btn-history-float { position: fixed; bottom: 30px; right: 30px; background: #d4a84b; color: #1a1209; border: none; border-radius: 60px; padding: 14px 22px; font-weight: 800; font-size: 0.9rem; box-shadow: 0 8px 25px rgba(212,168,75,0.3); cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 10px; z-index: 1000; }
        .btn-history-float:hover { background: #f0d78c; transform: scale(1.05); }
        .btn-history-float .badge { background: #dc2626; color: white; padding: 2px 10px; border-radius: 20px; font-size: 0.7rem; }
        
        .drawer { position: fixed; top: 0; right: -450px; width: 420px; height: 100%; background: #2a1e13; border-left: 2px solid #d4a84b; padding: 20px; overflow-y: auto; transition: right 0.3s ease; z-index: 2000; box-shadow: -10px 0 40px rgba(0,0,0,0.8); }
        .drawer.open { right: 0; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #d4a84b33; }
        .drawer-header h2 { color: #d4a84b; font-size: 1.3rem; }
        .drawer-header h2 i { margin-right: 10px; }
        .drawer-close { background: none; border: none; color: #a08b6d; font-size: 1.5rem; cursor: pointer; padding: 5px; }
        .drawer-close:hover { color: #f5e6c8; }
        
        .drawer-tabs { display: flex; gap: 6px; margin-bottom: 15px; }
        .drawer-tab { flex: 1; padding: 10px; text-align: center; border-radius: 10px; border: none; background: #3d2b1a; color: #a08b6d; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: 0.3s; }
        .drawer-tab.active { background: #d4a84b; color: #1a1209; box-shadow: 0 0 20px #d4a84b33; }
        .drawer-tab:hover { border-color: #d4a84b; }
        .drawer-tab .tab-badge { background: #dc2626; color: white; padding: 1px 8px; border-radius: 20px; font-size: 0.6rem; margin-left: 4px; }
        .drawer-tab.active .tab-badge { background: #1a1209; color: #d4a84b; }
        
        .drawer-actions { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .drawer-actions button { background: #3d2b1a; border: 1px solid #d4a84b44; color: #f5e6c8; padding: 10px 15px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.8rem; transition: 0.2s; flex: 1; }
        .drawer-actions button:hover { background: #d4a84b22; border-color: #d4a84b; }
        .drawer-actions .btn-danger { color: #f87171; border-color: #f8717144; }
        .drawer-actions .btn-danger:hover { background: #f8717122; border-color: #f87171; }
        
        .order-history-item { background: #1a1209; border-radius: 12px; padding: 12px; margin-bottom: 10px; border-left: 4px solid #d4a84b; }
        .order-history-item.from-app { border-left-color: #60a5fa; }
        .order-history-item .oh-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 5px; }
        .order-history-item .oh-id { color: #d4a84b; font-weight: 700; font-size: 0.9rem; }
        .order-history-item .oh-id.app-id { color: #60a5fa; }
        .order-history-item .oh-date { color: #a08b6d; font-size: 0.7rem; }
        .order-history-item .oh-customer { color: #f5e6c8; font-weight: 600; }
        .order-history-item .oh-total { color: #d4a84b; font-weight: 800; }
        .order-history-item .oh-items { color: #a08b6d; font-size: 0.8rem; margin: 5px 0; }
        .order-history-item .oh-source { color: #60a5fa; font-size: 0.7rem; font-weight: 600; margin-top: 4px; }
        .order-history-item .oh-source.app-source { color: #fbbf24; }
        .order-history-item .oh-status { font-size: 0.7rem; font-weight: 600; padding: 2px 10px; border-radius: 20px; display: inline-block; }
        .order-history-item .oh-status.new { background: #f8717122; color: #f87171; }
        .order-history-item .oh-status.accettato { background: #4ade8022; color: #4ade80; }
        .order-history-item .oh-status.preparing { background: #fbbf2422; color: #fbbf24; }
        .order-history-item .oh-status.ready { background: #4ade8022; color: #4ade80; }
        .order-history-item .oh-status.delivered { background: #60a5fa22; color: #60a5fa; }
        .order-history-item .oh-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .order-history-item .oh-actions button { background: #3d2b1a; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 0.7rem; cursor: pointer; transition: 0.2s; }
        .order-history-item .oh-actions .btn-print { color: #4ade80; }
        .order-history-item .oh-actions .btn-print:hover { background: #4ade8022; }
        .order-history-item .oh-actions .btn-delete { color: #f87171; }
        .order-history-item .oh-actions .btn-delete:hover { background: #f8717122; }
        
        .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1999; display: none; backdrop-filter: blur(3px); }
        .drawer-overlay.show { display: block; }
        
        .live-indicator { display: inline-block; width: 8px; height: 8px; background: #4ade80; border-radius: 50%; animation: liveBlink 1.5s infinite; margin-right: 6px; }
        @keyframes liveBlink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        @media (max-width: 900px) { .app-container { grid-template-columns: 1fr; } .drawer { width: 100%; right: -100%; } .btn-history-float { bottom: 20px; right: 20px; padding: 12px 18px; font-size: 0.8rem; } }
    </style>
</head>
<body>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

<div class="drawer" id="orderDrawer">
    <div class="drawer-header">
        <h2><i class="fas fa-history"></i> Storico Ordini</h2>
        <button class="drawer-close" onclick="closeDrawer()"><i class="fas fa-times"></i></button>
    </div>
    
    <div class="drawer-tabs">
        <button class="drawer-tab active" onclick="switchDrawerTab('banco', this)">🏪 Bancone <span class="tab-badge" id="bancoCount">0</span></button>
        <button class="drawer-tab" onclick="switchDrawerTab('app', this)">📱 App <span class="tab-badge" id="appCount">0</span></button>
    </div>
    
    <div class="drawer-actions" id="drawerActions">
        <button onclick="reprintAllOrders()"><i class="fas fa-print"></i> Ristampa Tutti</button>
        <button class="btn-danger" onclick="deleteAllOrders()"><i class="fas fa-trash-alt"></i> Elimina Tutti</button>
    </div>
    <div id="orderHistoryList">
        <div style="text-align:center; color:#a08b6d; padding:30px;">Nessun ordine registrato</div>
    </div>
</div>

<button class="btn-history-float" onclick="openDrawer()">
    <i class="fas fa-history" style="font-size:1.3rem;"></i> Storico
    <span class="badge" id="historyBadge">0</span>
</button>

<div class="app-container" id="appBanco">
    <div class="left-panel">
        <div class="header-banco">
            <h1><i class="fas fa-tachometer-alt"></i> Bancone</h1>
            <span class="printer-status"><span class="live-indicator"></span> LIVE</span>
        </div>
        
        <div class="search-bar">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="🔍 Cerca nel menu..." oninput="filterProducts(this.value)">
            <span class="clear-search" id="clearSearch" onclick="clearSearch()"><i class="fas fa-times-circle"></i></span>
            <button class="mic-btn" id="micBtn" onclick="toggleVoiceRecognition()" title="Usa la voce">
                <i class="fas fa-microphone"></i>
                <span class="mic-text">Voce</span>
            </button>
        </div>
        
        <div class="voice-status" id="voiceStatus">🎤 Premi il microfono e parla (es. "Pizze Margherita")</div>
        
        <div class="categorie-scroll" id="categoryList"></div>
        <div class="prodotti-grid" id="productList"></div>
    </div>

    <div class="right-panel">
        <div class="cart-header">
            <h2><i class="fas fa-shopping-cart"></i> Comanda</h2>
            <span class="totale" id="cartTotal">€0.00</span>
        </div>
        
        <div class="cart-items" id="cartItems"></div>

        <div class="dati-cliente">
            <div class="row">
                <input type="text" id="customerName" placeholder="Nome Cliente *">
                <input type="tel" id="customerPhone" placeholder="Telefono (opzionale)">
            </div>
            <div class="row-data">
                <input type="date" id="orderDate">
                <input type="time" id="orderTime" step="300">
            </div>
            <div class="mittente-row">
                <label><i class="fas fa-tag"></i> Mittente</label>
                <select id="orderSource">
                    <option value="CASSA">🏪 CASSA</option>
                    <option value="TELEFONO">📞 TELEFONO</option>
                    <option value="BANCO">🍕 BANCO</option>
                    <option value="TAVOLO">🍽️ TAVOLO</option>
                </select>
            </div>
            <input type="text" id="customerNotes" placeholder="Note (piano, citofono, ecc.)">
        </div>

        <div class="actions">
            <button class="btn-secondary-banco" onclick="clearCart()" style="flex:1;"><i class="fas fa-trash-alt"></i> Svuota</button>
            <button class="btn-primary-banco" onclick="sendOrderBanco()" style="flex:2;"><i class="fas fa-paper-plane"></i> Invia Ordine</button>
        </div>
        <div id="statusMsg" class="status-msg">Pronto per prendere l'ordine</div>
    </div>
</div>

<script>
// ============================================================
// FIREBASE CONFIG
// ============================================================
const firebaseConfig = {
    apiKey: "AIzaSyAw8pBS3gOpitVIArnWutBnwca3hXSWuVs",
    authDomain: "teogra-c8cf5.firebaseapp.com",
    databaseURL: "https://teogra-c8cf5-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "teogra-c8cf5",
    storageBucket: "teogra-c8cf5.firebasestorage.app",
    messagingSenderId: "686300112893",
    appId: "1:686300112893:web:e147b82f91374f12db1b94"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ============================================================
// STATO GLOBALE
// ============================================================
let cart = [];
let currentCategory = null;
let menuData = { categories: {}, products: {} };
let imagesData = { categories: {} };
let orderHistory = [];
let appOrders = [];
let searchTerm = '';
let recognition = null;
let isListening = false;
let drawerTab = 'banco';
let appOrdersListener = null;

// ============================================================
// CARICAMENTO DATI
// ============================================================
async function loadData() {
    try {
        const [catsSnap, menuSnap, settingsSnap, imagesSnap] = await Promise.all([
            db.ref('categories').once('value'),
            db.ref('menu').once('value'),
            db.ref('settings').once('value'),
            db.ref('images/categories').once('value')
        ]);
        
        if (catsSnap.exists()) menuData.categories = catsSnap.val();
        if (menuSnap.exists()) menuData.products = menuSnap.val();
        if (imagesSnap.exists()) imagesData.categories = imagesSnap.val();
        
        renderCategories();
        if (Object.keys(menuData.categories).length > 0) {
            const firstCat = Object.keys(menuData.categories)[0];
            selectCategory(firstCat);
        }
        setDefaultDateTime();
        loadOrderHistory();
        initVoiceRecognition();
        startAppOrdersListener();
    } catch (e) {
        console.error('Errore caricamento dati:', e);
        document.getElementById('statusMsg').textContent = '❌ Errore caricamento menu';
    }
}

// ============================================================
// ASCOLTO ORDINI DALL'APP
// ============================================================
function startAppOrdersListener() {
    if (appOrdersListener) return;
    
    appOrdersListener = db.ref('ordini')
        .orderByChild('timestamp')
        .limitToLast(20)
        .on('value', snapshot => {
            const newOrders = [];
            snapshot.forEach(child => {
                const order = { id: child.key, ...child.val() };
                if (order.source !== 'banco') {
                    newOrders.push(order);
                }
            });
            
            newOrders.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            appOrders = newOrders;
            renderHistory();
            updateDrawerBadges();
            updateHistoryBadge();
            
            if (newOrders.length > 0) {
                const lastOrder = newOrders[0];
                if (lastOrder.status === 'new') {
                    playNotificationSound();
                    showToast('📱 Nuovo ordine dall\'app: ' + lastOrder.orderId);
                }
            }
        });
}

// ============================================================
// RENDER CATEGORIE E PRODOTTI
// ============================================================
function renderCategories() {
    const container = document.getElementById('categoryList');
    container.innerHTML = Object.keys(menuData.categories).map(key => {
        const cat = menuData.categories[key];
        return `<button class="cat-btn" data-cat="${key}" onclick="selectCategory('${key}')">${cat.icon ? `<i class="fas ${cat.icon}"></i>` : ''} ${cat.name}</button>`;
    }).join('');
}

function selectCategory(key) {
    currentCategory = key;
    document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`.cat-btn[data-cat="${key}"]`)?.classList.add('active');
    document.getElementById('searchInput').value = '';
    searchTerm = '';
    document.getElementById('clearSearch').classList.remove('show');
    renderProducts(key);
}

function renderProducts(catKey) {
    const container = document.getElementById('productList');
    let products = menuData.products[catKey] || [];
    
    if (searchTerm) {
        const term = searchTerm.toLowerCase();
        products = products.filter(p => 
            p.name.toLowerCase().includes(term) || 
            (p.desc && p.desc.toLowerCase().includes(term))
        );
    }
    
    if (!products.length) {
        container.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#a08b6d; padding:30px;">' + 
            (searchTerm ? 'Nessun prodotto trovato' : 'Nessun prodotto in questa categoria') + 
            '</div>';
        return;
    }
    
    container.innerHTML = products.map((p, idx) => {
        const isDisabled = p.disabled === true;
        const imgUrl = p.img || '';
        const catImg = imagesData.categories[catKey] || '';
        const displayImg = imgUrl || catImg;
        const realIdx = menuData.products[catKey].indexOf(p);
        
        return `<div class="prod-item ${isDisabled ? 'disabled' : ''}" onclick="${isDisabled ? '' : `addToCart('${catKey}', ${realIdx})`}">
            ${displayImg ? `<img class="prod-img" src="${displayImg}" alt="${p.name}" onerror="this.style.display='none'">` : `<div class="prod-img" style="display:flex;align-items:center;justify-content:center;background:#1a1209;color:#d4a84b44;font-size:2rem;"><i class="fas fa-pizza-slice"></i></div>`}
            <span class="name">${p.name}</span>
            <span class="price">€${p.price.toFixed(2)}</span>
            ${isDisabled ? '<span class="badge-esaurito">ESAURITO</span>' : ''}
        </div>`;
    }).join('');
}

function filterProducts(term) {
    searchTerm = term.trim();
    const clearBtn = document.getElementById('clearSearch');
    if (searchTerm) {
        clearBtn.classList.add('show');
        const allProducts = [];
        Object.keys(menuData.products).forEach(catKey => {
            const products = menuData.products[catKey] || [];
            products.forEach(p => {
                if (p.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                    (p.desc && p.desc.toLowerCase().includes(searchTerm.toLowerCase()))) {
                    allProducts.push({ ...p, catKey: catKey, originalIndex: products.indexOf(p) });
                }
            });
        });
        
        const container = document.getElementById('productList');
        if (!allProducts.length) {
            container.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#a08b6d; padding:30px;">Nessun prodotto trovato</div>';
            return;
        }
        container.innerHTML = allProducts.map(p => {
            const isDisabled = p.disabled === true;
            const imgUrl = p.img || '';
            const catImg = imagesData.categories[p.catKey] || '';
            const displayImg = imgUrl || catImg;
            
            return `<div class="prod-item ${isDisabled ? 'disabled' : ''}" onclick="${isDisabled ? '' : `addToCart('${p.catKey}', ${p.originalIndex})`}">
                ${displayImg ? `<img class="prod-img" src="${displayImg}" alt="${p.name}" onerror="this.style.display='none'">` : `<div class="prod-img" style="display:flex;align-items:center;justify-content:center;background:#1a1209;color:#d4a84b44;font-size:2rem;"><i class="fas fa-pizza-slice"></i></div>`}
                <span class="name">${p.name}</span>
                <span class="price">€${p.price.toFixed(2)}</span>
                ${isDisabled ? '<span class="badge-esaurito">ESAURITO</span>' : ''}
                <span style="font-size:0.6rem;color:#a08b6d;">${menuData.categories[p.catKey]?.name || ''}</span>
            </div>`;
        }).join('');
        
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
    } else {
        clearBtn.classList.remove('show');
        if (currentCategory) {
            renderProducts(currentCategory);
            document.querySelector(`.cat-btn[data-cat="${currentCategory}"]`)?.classList.add('active');
        }
    }
}

function clearSearch() {
    document.getElementById('searchInput').value = '';
    filterProducts('');
}

// CARRELLO
// ============================================================
function addToCart(catKey, idx) {
    const product = menuData.products[catKey][idx];
    if (!product || product.disabled) return;
    
    const existing = cart.find(item => item.name === product.name && item.cat === catKey);
    if (existing) {
        existing.qty += 1;
    } else {
        cart.push({ ...product, cat: catKey, qty: 1 });
    }
    updateCartUI();
    playClickSound();
}

function updateCartQty(index, delta) {
    if (!cart[index]) return;
    cart[index].qty += delta;
    if (cart[index].qty <= 0) {
        cart.splice(index, 1);
    }
    updateCartUI();
}

function removeItem(index) {
    if (!cart[index]) return;
    cart.splice(index, 1);
    updateCartUI();
    showToast('🗑️ Prodotto rimosso');
}

function clearCart() {
    if (!cart.length) return;
    if (confirm('Svuotare il carrello?')) {
        cart = [];
        updateCartUI();
    }
}

function updateCartUI() {
    const container = document.getElementById('cartItems');
    const totalEl = document.getElementById('cartTotal');
    let total = 0;
    
    if (!cart.length) {
        container.innerHTML = '<div style="text-align:center; color:#a08b6d; padding:20px;">Nessun prodotto aggiunto</div>';
        totalEl.textContent = '€0.00';
        return;
    }
    
    container.innerHTML = cart.map((item, idx) => {
        total += item.price * item.qty;
        return `<div class="cart-item">
            <div class="item-info">
                <button class="remove-item" onclick="removeItem(${idx})" title="Rimuovi"><i class="fas fa-times-circle"></i></button>
                <span>${item.name} x${item.qty}</span>
            </div>
            <span>€${(item.price * item.qty).toFixed(2)}</span>
            <div class="qty-control">
                <button class="qty-btn" onclick="updateCartQty(${idx}, -1)">−</button>
                <span>${item.qty}</span>
                <button class="qty-btn" onclick="updateCartQty(${idx}, 1)">+</button>
            </div>
        </div>`;
    }).join('');
    
    totalEl.textContent = `€${total.toFixed(2)}`;
}

// ============================================================
// RICONOSCIMENTO VOCALE (con stop automatico su "invia")
// ============================================================
function initVoiceRecognition() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        document.getElementById('voiceStatus').textContent = '❌ Browser non supporta la voce. Usa Chrome.';
        document.getElementById('micBtn').style.opacity = '0.5';
        document.getElementById('micBtn').style.cursor = 'not-allowed';
        return;
    }
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'it-IT';
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 5;
    
    recognition.onresult = function(event) {
        let finalText = '';
        let interimText = '';
        
        for (let i = event.resultIndex; i < event.results.length; i++) {
            if (event.results[i].isFinal) {
                finalText += event.results[i][0].transcript;
            } else {
                interimText += event.results[i][0].transcript;
            }
        }
        
        const displayText = finalText || interimText;
        document.getElementById('voiceStatus').textContent = '🗣️ ' + displayText;
        document.getElementById('voiceStatus').className = 'voice-status active';
        
        if (finalText) {
            const textLower = finalText.toLowerCase();
            
            // 🔥 Se dice "invia" o "stampa" → ferma microfono e invia ordine
            if (textLower.includes('invia') || textLower.includes('stampa') || textLower.includes('manda')) {
                stopListening(); // Ferma il microfono
                document.getElementById('voiceStatus').textContent = '📨 Invio ordine per voce...';
                document.getElementById('voiceStatus').className = 'voice-status success';
                sendOrderBanco();
                setTimeout(() => {
                    document.getElementById('voiceStatus').textContent = '✅ Ordine inviato!';
                }, 500);
                return;
            }
            
            processVoiceCommand(textLower);
        }
    };
    
    recognition.onerror = function(event) {
        console.error('Errore voce:', event.error);
        document.getElementById('voiceStatus').textContent = '❌ Errore: ' + event.error;
        document.getElementById('voiceStatus').className = 'voice-status error';
        stopListening();
    };
    
    recognition.onend = function() {
        // Il microfono si ferma da solo quando smette di parlare
        stopListening();
    };
}

function toggleVoiceRecognition() {
    if (isListening) {
        stopListening();
    } else {
        startListening();
    }
}

function startListening() {
    if (!recognition) {
        document.getElementById('voiceStatus').textContent = '❌ Voce non disponibile';
        return;
    }
    
    try {
        recognition.start();
        isListening = true;
        document.getElementById('micBtn').classList.add('listening');
        document.getElementById('micBtn').innerHTML = '<i class="fas fa-stop"></i><span class="mic-text">Stop</span>';
        document.getElementById('voiceStatus').textContent = '🎤 Ascolto... parla ora! (dì "invia" per stampare)';
        document.getElementById('voiceStatus').className = 'voice-status active';
    } catch(e) {
        console.error('Errore avvio:', e);
    }
}

function stopListening() {
    try {
        if (recognition) recognition.stop();
    } catch(e) {}
    isListening = false;
    document.getElementById('micBtn').classList.remove('listening');
    document.getElementById('micBtn').innerHTML = '<i class="fas fa-microphone"></i><span class="mic-text">Voce</span>';
    if (document.getElementById('voiceStatus').textContent.includes('Ascolto') || 
        document.getElementById('voiceStatus').textContent.includes('parla')) {
        document.getElementById('voiceStatus').textContent = '🎤 Premi il microfono e parla (es. "Pizze Margherita")';
        document.getElementById('voiceStatus').className = 'voice-status';
    }
}

function processVoiceCommand(text) {
    let added = 0;
    let foundProducts = [];
    let categoriesFound = [];
    
    const categoryNames = Object.keys(menuData.categories).map(key => ({
        key: key,
        name: menuData.categories[key].name.toLowerCase()
    }));
    
    categoryNames.forEach(cat => {
        if (text.includes(cat.name)) {
            categoriesFound.push(cat.key);
        }
    });
    
    if (categoriesFound.length > 0) {
        categoriesFound.forEach(catKey => {
            const products = menuData.products[catKey] || [];
            products.forEach(p => {
                const nameLower = p.name.toLowerCase();
                if (text.includes(nameLower) || 
                    text.split(' ').some(word => word.length > 2 && nameLower.includes(word))) {
                    const existing = foundProducts.find(f => f.name === p.name && f.catKey === catKey);
                    if (!existing) {
                        foundProducts.push({ ...p, catKey: catKey });
                    }
                }
            });
        });
    } else {
        const allProducts = getAllProducts();
        const words = text.split(/\s+/);
        allProducts.forEach(p => {
            const nameLower = p.name.toLowerCase();
            if (text.includes(nameLower) || 
                words.some(word => word.length > 2 && nameLower.includes(word))) {
                const existing = foundProducts.find(f => f.name === p.name && f.catKey === p.catKey);
                if (!existing) {
                    foundProducts.push(p);
                }
            }
        });
    }
    
    if (foundProducts.length > 5) {
        foundProducts = foundProducts.slice(0, 5);
    }
    
    foundProducts.forEach(p => {
        const existing = cart.find(item => item.name === p.name && item.cat === p.catKey);
        if (existing) {
            existing.qty += 1;
        } else {
            cart.push({ ...p, cat: p.catKey, qty: 1 });
        }
        added++;
    });
    
    const phoneMatch = text.match(/(3[0-9]{9})/);
    if (phoneMatch) {
        document.getElementById('customerPhone').value = phoneMatch[1];
    }
    
    const nameMatch = text.match(/(?:nome|per|chiama)\s+([a-zA-ZÀ-ù\s]{2,20})/i);
    if (nameMatch) {
        const name = nameMatch[1].trim();
        if (name.length > 2) {
            document.getElementById('customerName').value = name;
        }
    }
    
    if (added > 0) {
        updateCartUI();
        const catInfo = categoriesFound.length > 0 ? ' (categoria: ' + categoriesFound.map(k => menuData.categories[k].name).join(', ') + ')' : '';
        document.getElementById('voiceStatus').textContent = '✅ Aggiunti ' + added + ' prodotto/i: ' + foundProducts.map(p => p.name).join(', ') + catInfo;
        document.getElementById('voiceStatus').className = 'voice-status success';
        playNotificationSound();
        
        setTimeout(() => {
            if (cart.length > 0) {
                document.getElementById('voiceStatus').textContent = '💡 Dì "invia" per stampare l\'ordine';
                document.getElementById('voiceStatus').className = 'voice-status';
            }
        }, 3000);
    } else {
        document.getElementById('voiceStatus').textContent = '❌ Nessun prodotto riconosciuto. Riprova! (es. "Pizze Margherita")';
        document.getElementById('voiceStatus').className = 'voice-status error';
        setTimeout(() => {
            document.getElementById('voiceStatus').textContent = '🎤 Premi il microfono e parla (es. "Pizze Margherita")';
            document.getElementById('voiceStatus').className = 'voice-status';
        }, 4000);
    }
}

function getAllProducts() {
    const all = [];
    Object.keys(menuData.products).forEach(catKey => {
        const products = menuData.products[catKey] || [];
        products.forEach(p => {
            all.push({ ...p, catKey: catKey });
        });
    });
    return all;
}

// ============================================================
// INVIO ORDINE
// ============================================================
async function sendOrderBanco() {
    if (!cart.length) {
        document.getElementById('statusMsg').textContent = '⚠️ Aggiungi almeno un prodotto';
        return;
    }
    
    const name = document.getElementById('customerName').value.trim();
    const phone = document.getElementById('customerPhone').value.trim();
    const date = document.getElementById('orderDate').value;
    const time = document.getElementById('orderTime').value;
    const notes = document.getElementById('customerNotes').value.trim();
    const source = document.getElementById('orderSource').value;
    
    if (!name) {
        document.getElementById('statusMsg').textContent = '⚠️ Inserisci il Nome del Cliente';
        return;
    }
    
    let scheduledTime = 'Prima possibile';
    if (date && time) {
        const dateObj = new Date(date + 'T' + time);
        scheduledTime = dateObj.toLocaleString('it-IT', {
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    } else if (date) {
        const dateObj = new Date(date);
        scheduledTime = dateObj.toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
    } else if (time) {
        scheduledTime = time;
    }
    
    const btn = document.querySelector('.btn-primary-banco');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Invio...';
    btn.disabled = true;
    document.getElementById('statusMsg').textContent = '⏳ Invio ordine...';
    
    try {
        let productsTotal = 0;
        const items = cart.map(item => {
            const price = item.price * item.qty;
            productsTotal += price;
            return { name: item.name, qty: item.qty, price: item.price, cat: item.cat };
        });
        
        const finalTotal = productsTotal;
        
        const snap = await db.ref('counter/ordini').transaction(c => (c || 0) + 1);
        const orderNum = snap.snapshot.val();
        const orderId = 'ORD-' + String(orderNum).padStart(5, '0');
        
        const orderRef = db.ref('ordini').push();
        await orderRef.set({
            orderId: orderId,
            customerName: name,
            customerPhone: phone || '',
            address: '',
            notes: notes,
            type: 'pickup',
            scheduledTime: scheduledTime,
            items: items,
            productsTotal: productsTotal,
            deliveryFee: 0,
            finalTotal: finalTotal,
            status: 'new',
            timestamp: Date.now(),
            source: source
        });
        
        const orderData = {
            orderId, customerName: name, customerPhone: phone || 'N/A',
            scheduledTime, items, finalTotal, notes: notes || 'Nessuna',
            timestamp: Date.now(),
            source: source
        };
        orderHistory.unshift(orderData);
        if (orderHistory.length > 100) orderHistory.pop();
        localStorage.setItem('banco_orders', JSON.stringify(orderHistory));
        
        cart = [];
        updateCartUI();
        document.getElementById('customerName').value = '';
        document.getElementById('customerPhone').value = '';
        document.getElementById('customerNotes').value = '';
        setDefaultDateTime();
        
        document.getElementById('statusMsg').textContent = `✅ Ordine ${orderId} inviato da ${source}!`;
        
        // 🔥 STAMPA: usa la stessa logica della tua webapp
        printOrder(orderData);
        playNotificationSound();
        updateDrawerBadges();
        updateHistoryBadge();
        
    } catch (e) {
        console.error(e);
        document.getElementById('statusMsg').textContent = '❌ Errore invio ordine';
    } finally {
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Invia Ordine';
        btn.disabled = false;
    }
}

           ORDINE #${order.orderId}
           📅 ${new Date().toLocaleString()}

    printWindow.document.write(`

        <style>
            body { font-family: 'Courier New', monospace; font-size: 12px; padding: 20px; white-space: pre; background: white; color: black; }
            @media print { body { margin: 0; padding: 10px; } .no-print { display: none; } }

}

function updateHistoryBadge() {

    if (badge) badge.textContent = total;
}

function openDrawer() {
    document.getElementById('orderDrawer').classList.add('open');
    document.getElementById('drawerOverlay').classList.add('show');
    renderHistory();
}

function closeDrawer() {
    document.getElementById('orderDrawer').classList.remove('open');
    document.getElementById('drawerOverlay').classList.remove('show');

function reprintOrder(orderId) {
    let order = orderHistory.find(o => o.orderId === orderId);
    if (!order) {
        order = appOrders.find(o => o.orderId === orderId);
    }
    if (order) {
        printOrder(order);
        showToast('🖨️ Ristampa inviata');
    } else {
        showToast('❌ Ordine non trovato');
    }
}

function reprintAllOrders() {
    const orders = drawerTab === 'banco' ? orderHistory : appOrders;
    if (!orders.length) {
        showToast('❌ Nessun ordine da ristampare');
        return;
    }
    if (!confirm('Ristampare TUTTI gli ordini?')) return;
    orders.forEach(o => printOrder(o));
    showToast('🖨️ Ristampa di tutti gli ordini avviata');
}

function deleteOrder(orderId) {
    if (!confirm(`Eliminare l'ordine ${orderId}?`)) return;
    orderHistory = orderHistory.filter(o => o.orderId !== orderId);
    localStorage.setItem('banco_orders', JSON.stringify(orderHistory));
    renderHistory();
    updateDrawerBadges();
    updateHistoryBadge();
    showToast(`🗑️ Ordine ${orderId} eliminato`);
}

function deleteAllOrders() {
    const orders = drawerTab === 'banco' ? orderHistory : appOrders;
    if (!orders.length) {
        showToast('❌ Nessun ordine da eliminare');
        return;
    }
    if (!confirm('⚠️ Eliminare TUTTI gli ordini dallo storico?')) return;
    if (drawerTab === 'banco') {
        orderHistory = [];
        localStorage.setItem('banco_orders', JSON.stringify(orderHistory));
    } else {
        showToast('ℹ️ Gli ordini dall\'app possono essere eliminati solo dal pannello admin');
        return;
    }
    renderHistory();
    updateDrawerBadges();
    updateHistoryBadge();
    showToast('🗑️ Tutti gli ordini eliminati');
}

// ============================================================
// UTILITY
// ============================================================
function showToast(msg) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    setTimeout(() => {
        if (el.textContent === msg) el.textContent = 'Pronto per prendere l\'ordine';
    }, 3000);
}

function playNotificationSound() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = 880; gain.gain.value = 0.3;
        osc.start();
        setTimeout(() => { osc.frequency.value = 1100; }, 100);
        setTimeout(() => { osc.frequency.value = 880; }, 200);
        setTimeout(() => { osc.stop(); }, 400);
    } catch(e) {}
}

function playClickSound() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = 600; gain.gain.value = 0.15;
        osc.start();
        setTimeout(() => { osc.stop(); }, 80);
    } catch(e) {}
}

function setDefaultDateTime() {
    const now = new Date();
    const dateInput = document.getElementById('orderDate');
    const timeInput = document.getElementById('orderTime');
    
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    dateInput.value = `${year}-${month}-${day}`;
    
    now.setMinutes(Math.ceil(now.getMinutes() / 15) * 15, 0, 0);
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    timeInput.value = `${hours}:${minutes}`;
}

document.addEventListener('DOMContentLoaded', loadData);
</script>
